rules_file:
  - /etc/falco/falco_rules.yaml
  - /etc/falco/rules.d/falco_rules.local.yaml

json_output: true
json_include_output_property: true
json_include_tags_property: true

log_stderr: true
log_syslog: false

buffered_outputs: false

stdout_output:
  enabled: true

syslog_output:
  enabled: false

file_output:
  enabled: false


priority: notice

grpc:
  enabled: true
  bind_address: "unix:///tmp/falco.sock"
  threadiness: 8

grpc_output:
  enabled: true

webserver:
  enabled: true
  listen_port: 8765
  ssl_enabled: false
  k8s_healthz_endpoint: /healthz

engine:
  kind: ebpf


container_engines:
  docker:
    enabled: true
    sockets: [/var/run/docker.sock]

program_output:
  enabled: false

http_output:
  enabled: true
  url: http://falcosidekick:2801
  user_agent: "falcosecurity/falco"