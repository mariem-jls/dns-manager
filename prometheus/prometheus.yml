global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'bind9'
    static_configs:
      - targets: ['bind-exporter:9119']
  - job_name: 'falco'
    static_configs:
      - targets: ['falco:8765']
  - job_name: 'falco-exporter'
    static_configs:
      - targets: ['falco-exporter:9376']
  