global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ============================================
  # PROMETHEUS (self-monitoring)
  # ============================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ============================================
  # BIND9 (DNS metrics)
  # ============================================
  - job_name: 'bind9'
    static_configs:
      - targets: ['bind-exporter:9119']

  # ============================================
  # WAZUH (désactivé temporairement)
  # ============================================
  # Décommenter quand Wazuh sera réactivé
  # - job_name: 'wazuh'
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ['wazuh-exporter:5000']